<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sanctuary | Listening Voices</title>
    
    <script>
        // Audio assets - currently placeholders until human recordings are uploaded
        window.AUDIO_ASSETS = { elias: "", clara: "" };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:italic,wght@0,400;1,400;1,500;1,600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxYXQFTFKrcSSLI1hELd86tmrmb6ndRjQ",
            authDomain: "the-listening-voices-project.firebaseapp.com",
            projectId: "the-listening-voices-project",
            storageBucket: "the-listening-voices-project.firebasestorage.app",
            messagingSenderId: "23814688068",
            appId: "1:23814688068:web:bfa44db13579a08a0fdb11"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Global function to save suggestions to the Sanctuary
        window.saveData = async (col, data) => {
            try { 
                await addDoc(collection(db, col), { ...data, timestamp: serverTimestamp() }); 
                return true; 
            } catch (e) { 
                console.error("Sanctuary Error:", e);
                return false; 
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #f8f8f6; color: #1a1a1a; scroll-behavior: smooth; }
        .font-serif { font-family: 'Lora', serif; }
        .nav-blur { background: rgba(248, 248, 246, 0.9); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); transition: all 0.4s ease; }
        .card-shadow:hover { box-shadow: 0 20px 40px -4px rgba(0,0,0,0.1); transform: translateY(-4px); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 1.2s ease-in-out; }
        .selection-style::selection { background: #000; color: #fff; }
    </style>
</head>
<body class="selection-style">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [activeKey, setActiveKey] = useState(null);
            const audioRef = useRef(null);

            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
                window.scrollTo(0,0); 
            }, [view]);

            const stories = {
                elias: {
                    name: "Elias",
                    location: "5th Street",
                    entry: "Entry 001",
                    quote: "The bricks have ears, and I've been listening to the city breathe for three decades.",
                    content: [
                        "Elias stands where the old bakery used to be, a fixture of the downtown core for thirty years. He doesn't speak much to the tourists rushing toward the harbor, but he notices the way the light hits the cracked pavement at 4 PM.",
                        "He says the city is a living thing, and right now, it's holding its breath, waiting for a rhythm it once knew. He remains a silent sentinel, a collector of whispers in a world that has grown too loud to listen."
                    ],
                    audio: window.AUDIO_ASSETS.elias
                },
                clara: {
                    name: "Clara",
                    location: "East 85th St, Brooklyn",
                    entry: "Entry 002",
                    quote: "The soil remembers what the skyscrapers forgot.",
                    content: [
                        "Clara’s garden is a defiance of concrete. She grows tomatoes in salted earth and lilies in the shadow of the terminal. For almost 60 years, East 85th Street has been her sanctuary, her patch of life in a city that often feels uncaring. Clara believes that as long as something is growing, the neighborhood still has a soul.",
                        "She remembers the bustling days when street vendors filled the air with the aroma of baked challah and fried latkes. Laughter resonated like music—a symphony of stories woven through generations. Yet, amid the city’s vibrancy, Clara has seen the darker side of New York: the loss of friends to violence and the erosion of community ties during trying times.",
                        "Then came September 11, 2001. Clara was working in one of the towers when the attacks unfolded. The world shifted in an instant. Dust, smoke, and dirt engulfed her as she fled, a surreal contrast to the life she had known. Emerging from the chaos, she looked like a ghost, her clothes tattered and her spirit tested.",
                        "But like the seeds in her garden, buried beneath the soil, she refused to remain hidden. The experience left scars, but it also illuminated a deeper resolve. Clara rose from that day, determined to nurture hope amidst despair.",
                        "In her garden, Clara finds solace. Every sprouting seed is a tribute to her resilience, echoing the struggles she and her community have faced—her own survival a testament to the power of persistence. She meticulously tends to each plant, whispering words of encouragement, nurturing their growth as if they can absorb her hopes and fears.",
                        "As autumn's first chill creeps in, Clara knows winter will come. But like her plants, which go dormant only to reemerge with vigor in the spring, she holds fast to the belief that hope can blossom anew. “We are all like the seeds,” she tells her neighbors. “Buried, we may feel lost, but our roots dig deep. With time, warmth, and care, we will rise again.”"
                    ],
                    audio: window.AUDIO_ASSETS.clara
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <nav className="fixed top-0 w-full z-50 nav-blur border-b border-black/5 py-5 px-6 md:px-12">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div onClick={() => setView('home')} className="flex items-center gap-3 cursor-pointer group">
                                <div className="w-6 h-6 bg-black rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <div className="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></div>
                                </div>
                                <span className="font-bold text-xs tracking-[0.2em] uppercase">The Sanctuary</span>
                            </div>
                            <button onClick={() => setView('submit')} className="text-[10px] font-bold uppercase tracking-[0.2em] px-5 py-2 border border-black rounded-full hover:bg-black hover:text-white transition-all">Suggest a Voice</button>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 px-6 md:px-12">
                        {view === 'home' ? (
                            <div className="max-w-6xl mx-auto animate-fade">
                                <section className="mb-24 md:mb-32">
                                    <h1 className="text-[14vw] md:text-[8.5rem] font-black tracking-tighter leading-none mb-8 text-black">YOU ARE NOT ALONE.</h1>
                                    <p className="font-serif italic text-2xl md:text-3xl text-slate-500 max-w-3xl leading-snug">
                                        This is a place to remember that the human spirit is unyielding. Explore the records of those who have survived, endured, and bloomed in the harshest conditions.
                                    </p>
                                </section>
                                
                                <div className="grid md:grid-cols-2 gap-10 md:gap-16 mb-32">
                                    {Object.entries(stories).map(([key, story]) => (
                                        <div key={key} onClick={() => {setActiveKey(key); setView('story');}} className="bg-white p-10 md:p-14 rounded-[2.5rem] card-shadow cursor-pointer flex flex-col justify-between aspect-[4/5]">
                                            <div>
                                                <p className="text-[10px] font-bold tracking-[0.4em] text-indigo-500 uppercase mb-4">{story.entry}</p>
                                                <h3 className="text-5xl md:text-6xl font-black tracking-tighter mb-2">{story.name}</h3>
                                                <p className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-10">{story.location}</p>
                                            </div>
                                            <p className="font-serif italic text-2xl md:text-3xl text-slate-800 leading-tight">"{story.quote}"</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : view === 'story' ? (
                            <div className="max-w-3xl mx-auto pb-40 animate-fade">
                                <button onClick={() => setView('home')} className="mb-16 flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-black transition-colors">
                                    <i data-lucide="arrow-left" className="w-3 h-3"></i> Return to the Archive
                                </button>
                                
                                <div className="mb-20">
                                    <p className="text-[10px] font-bold tracking-[0.4em] text-indigo-500 uppercase mb-4">{stories[activeKey].entry}</p>
                                    <h2 className="text-7xl md:text-8xl font-black mb-4 tracking-tighter leading-none uppercase">{stories[activeKey].name}</h2>
                                    <p className="text-[10px] font-bold tracking-[0.3em] uppercase text-slate-400">{stories[activeKey].location}</p>
                                </div>

                                <div className="narrative-container">
                                    <p className="font-serif italic text-3xl md:text-4xl text-black leading-tight mb-16 border-l-8 border-black pl-8 py-2">
                                        "{stories[activeKey].quote}"
                                    </p>
                                    
                                    {/* Audio Player Box - Only active if link exists */}
                                    {stories[activeKey].audio ? (
                                        <div className="bg-black text-white p-10 rounded-[3rem] mb-16 flex items-center gap-8 shadow-xl">
                                            <div className="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center">
                                                <i data-lucide="play" className="w-6 h-6 ml-1"></i>
                                            </div>
                                            <div>
                                                <p className="text-[9px] font-bold tracking-[0.3em] uppercase opacity-40 mb-1">Sonic Archive</p>
                                                <h4 className="text-lg font-bold">Listen to the Voice</h4>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="bg-slate-100 border border-slate-200 p-8 rounded-[2.5rem] mb-16 flex items-center gap-6 opacity-60">
                                            <div className="w-10 h-10 rounded-full border border-slate-300 flex items-center justify-center text-slate-400">
                                                <i data-lucide="mic-off" className="w-4 h-4"></i>
                                            </div>
                                            <div>
                                                <p className="text-[9px] font-bold tracking-widest uppercase mb-1">Oral Archive Pending</p>
                                                <p className="text-xs text-slate-500 font-serif italic">Preserved in written form for the Sanctuary.</p>
                                            </div>
                                        </div>
                                    )}

                                    <div className="space-y-8">
                                        {stories[activeKey].content.map((para, i) => (
                                            <p key={i} className={`text-xl md:text-2xl font-light text-slate-600 leading-relaxed ${i === 0 ? 'first-letter:text-8xl first-letter:font-black first-letter:mr-4 first-letter:float-left first-letter:text-black first-letter:mt-2' : ''}`}>
                                                {para}
                                            </p>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-2xl mx-auto py-12 animate-fade">
                                <h2 className="text-6xl font-black mb-6 tracking-tighter uppercase">Share Your Light.</h2>
                                <p className="text-slate-500 font-serif italic text-xl mb-16 leading-relaxed">
                                    Whether you have a story of survival or a fragment of hope, your voice could be the anchor for someone else drifting in the dark.
                                </p>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const btn = e.target.querySelector('button');
                                    btn.disabled = true; btn.innerText = "Securing Narrative...";
                                    const data = Object.fromEntries(new FormData(e.target).entries());
                                    const success = await window.saveData('suggestions', data);
                                    if (success) { 
                                        alert("Your story has been safely received by the Sanctuary."); 
                                        e.target.reset(); 
                                        setView('home'); 
                                    } else {
                                        alert("Connection error. Please try again.");
                                        btn.disabled = false; btn.innerText = "Contribute to the Archive";
                                    }
                                }} className="space-y-12">
                                    <div className="border-b border-black/10 focus-within:border-black transition-colors pb-4">
                                        <label className="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400 mb-2 block">Name or Identifier</label>
                                        <input required name="name" className="w-full bg-transparent outline-none text-2xl font-bold tracking-tight" placeholder="E.g. A Survivor in Brooklyn" />
                                    </div>
                                    <div className="border-b border-black/10 focus-within:border-black transition-colors pb-4">
                                        <label className="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400 mb-2 block">Your Narrative of Resilience</label>
                                        <textarea required name="story" rows="4" className="w-full bg-transparent outline-none text-xl font-light leading-relaxed resize-none" placeholder="How did you find your way back to the light?"></textarea>
                                    </div>
                                    <button className="w-full py-8 bg-black text-white rounded-2xl font-extrabold uppercase tracking-[0.4em] text-[10px] shadow-2xl hover:bg-indigo-700 transition-all active:scale-[0.98]">Contribute to the Archive</button>
                                </form>
                            </div>
                        )}
                    </main>

                    <footer className="py-24 text-center border-t border-black/5 mx-12 mt-20">
                        <p className="font-serif italic text-lg text-slate-400 mb-4">"To listen is to love, and to share is to survive."</p>
                        <p className="text-[8px] font-bold uppercase tracking-[0.5em] opacity-30">The Sanctuary &copy; 2026</p>
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
