<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary of Voices | A Listening Voices Project</title>
    
    <script>
        window.AUDIO_ASSETS = { elias: "", clara: "" };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:italic,wght@0,400;1,400;1,500;1,600&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Sanctuary of Voices - Production Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAxYXQFTFKrcSSLI1hELd86tmrmb6ndRjQ",
            authDomain: "the-listening-voices-project.firebaseapp.com",
            projectId: "the-listening-voices-project",
            storageBucket: "the-listening-voices-project.firebasestorage.app",
            messagingSenderId: "23814688068",
            appId: "1:23814688068:web:bfa44db13579a08a0fdb11"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.saveData = async (col, data) => {
            try { 
                await addDoc(collection(db, col), { ...data, timestamp: serverTimestamp() }); 
                return true; 
            } catch (e) { 
                return false; 
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #f8f8f6; color: #1a1a1a; scroll-behavior: smooth; }
        .font-serif { font-family: 'Lora', serif; }
        .nav-blur { background: rgba(248, 248, 246, 0.9); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); transition: all 0.5s cubic-bezier(0.2, 1, 0.2, 1); }
        .card-shadow:hover { box-shadow: 0 30px 60px -12px rgba(0,0,0,0.08); transform: translateY(-8px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 1.2s cubic-bezier(0.2, 1, 0.2, 1) forwards; }
        .logo-spin:hover { transform: rotate(180deg); transition: transform 0.8s ease; }
    </style>
</head>
<body class="selection:bg-black selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [activeKey, setActiveKey] = useState(null);

            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
                window.scrollTo(0,0); 
            }, [view]);

            const stories = {
                elias: {
                    name: "Elias",
                    location: "5th Street",
                    entry: "Record 001",
                    quote: "The bricks have ears, and I've been listening to the city breathe for three decades.",
                    content: [
                        "Elias stands where the old bakery used to be, a fixture of the downtown core for thirty years. He doesn't speak much to the tourists rushing toward the harbor, but he notices the way the light hits the cracked pavement at 4 PM.",
                        "He believes that even the mortar between the stones carries the weight of every conversation it has ever overheard. In a city that is constantly tearing itself down to build something newer and louder, Elias remains a silent sentinel, a collector of whispers. To him, the city isn't just a place to live; it's a living, breathing history book, and right now, it's holding its breath, waiting for a rhythm it once knew."
                    ]
                },
                clara: {
                    name: "Clara",
                    location: "East 85th St, Brooklyn",
                    entry: "Record 002",
                    quote: "The soil remembers what the skyscrapers forgot.",
                    content: [
                        "Clara’s garden is a defiance of concrete. She grows tomatoes in salted earth and lilies in the shadow of the terminal. For almost 60 years, East 85th Street has been her sanctuary, her patch of life in a city that often feels uncaring.",
                        "She remembers the bustling days when street vendors filled the air with the aroma of baked challah and fried latkes. Laughter resonated like music—a symphony of stories woven through generations. Yet, amid the city’s vibrancy, Clara has seen the darker side of New York: the loss of friends to violence and the erosion of community ties during trying times.",
                        "Then came September 11, 2001. Clara was working in one of the towers when the attacks unfolded. Dust, smoke, and dirt engulfed her as she fled, a surreal contrast to the life she had known. Emerging from the chaos, she looked like a ghost, her clothes tattered and her spirit tested.",
                        "But like the seeds in her garden, buried beneath the soil, she refused to remain hidden. The experience left scars, but it also illuminated a deeper resolve. Clara rose from that day, determined to nurture hope amidst despair.",
                        "In her garden, Clara finds solace. Every sprouting seed is a tribute to her resilience, echoing the struggles she and her community have faced—her own survival a testament to the power of persistence. She meticulously tends to each plant, whispering words of encouragement, nurturing their growth as if they can absorb her hopes and fears.",
                        "As autumn's first chill creeps in, Clara knows winter will come. But like her plants, which go dormant only to reemerge with vigor in the spring, she holds fast to the belief that hope can blossom anew. “We are all like the seeds,” she tells her neighbors. “Buried, we may feel lost, but our roots dig deep. With time, warmth, and care, we will rise again.”"
                    ]
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <nav className="fixed top-0 w-full z-50 nav-blur border-b border-black/5 py-6 px-6 md:px-12">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div onClick={() => setView('home')} className="flex items-center gap-3 cursor-pointer group">
                                <div className="w-8 h-8 bg-black rounded-full flex items-center justify-center logo-spin">
                                    <div className="w-2 h-2 bg-white rounded-full"></div>
                                </div>
                                <span className="font-bold text-sm tracking-[0.25em] uppercase">Sanctuary of Voices</span>
                            </div>
                            <button onClick={() => setView('submit')} className="text-[10px] font-bold uppercase tracking-[0.2em] px-6 py-2 bg-black text-white rounded-full hover:bg-indigo-600 transition-all">Suggest Record</button>
                        </div>
                    </nav>

                    <main className="flex-grow pt-40 px-6 md:px-12">
                        {view === 'home' ? (
                            <div className="max-w-6xl mx-auto animate-fade">
                                <section className="mb-24 md:mb-36">
                                    <h1 className="text-[14vw] md:text-[8rem] font-black tracking-tighter leading-[0.85] mb-12 text-black">NO VOICE IS LOST.</h1>
                                    <p className="font-serif italic text-2xl md:text-4xl text-slate-400 max-w-4xl leading-tight">
                                        Welcome to the Sanctuary of Voices. We preserve the narratives of survival hidden in the city's architecture and the soil of its gardens.
                                    </p>
                                </section>
                                
                                <div className="grid md:grid-cols-2 gap-12 md:gap-20 mb-32">
                                    {Object.entries(stories).map(([key, story]) => (
                                        <div key={key} onClick={() => {setActiveKey(key); setView('story');}} className="bg-white p-12 md:p-16 rounded-[3rem] card-shadow cursor-pointer flex flex-col justify-between aspect-[4/5]">
                                            <div>
                                                <p className="text-[10px] font-bold tracking-[0.5em] text-indigo-500 uppercase mb-4">{story.entry}</p>
                                                <h3 className="text-6xl font-black tracking-tighter mb-3 leading-none">{story.name}</h3>
                                                <p className="text-[10px] uppercase tracking-[0.3em] text-slate-400 font-bold mb-12">{story.location}</p>
                                            </div>
                                            <p className="font-serif italic text-3xl text-slate-800 leading-tight">"{story.quote}"</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : view === 'story' ? (
                            <div className="max-w-3xl mx-auto pb-48 animate-fade">
                                <button onClick={() => setView('home')} className="mb-16 flex items-center gap-3 text-xs font-bold uppercase tracking-widest text-slate-300 hover:text-black transition-colors">
                                    <i data-lucide="arrow-left" className="w-4 h-4"></i> Back to the Sanctuary
                                </button>
                                
                                <div className="mb-20">
                                    <p className="text-[10px] font-bold tracking-[0.5em] text-indigo-500 uppercase mb-4">{stories[activeKey].entry}</p>
                                    <h2 className="text-8xl md:text-9xl font-black mb-6 tracking-tighter leading-none uppercase">{stories[activeKey].name}</h2>
                                    <p className="text-[10px] font-bold tracking-[0.4em] uppercase text-slate-400">{stories[activeKey].location}</p>
                                </div>

                                <div className="prose-layout">
                                    <p className="font-serif italic text-4xl md:text-5xl text-black leading-tight mb-20 border-l-[12px] border-black pl-10 py-2">
                                        "{stories[activeKey].quote}"
                                    </p>
                                    
                                    <div className="space-y-10">
                                        {stories[activeKey].content.map((para, i) => (
                                            <p key={i} className={`text-2xl md:text-3xl font-light text-slate-600 leading-relaxed ${i === 0 ? 'first-letter:text-9xl first-letter:font-black first-letter:mr-5 first-letter:float-left first-letter:text-black first-letter:leading-none' : ''}`}>
                                                {para}
                                            </p>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-2xl mx-auto py-12 animate-fade">
                                <h2 className="text-7xl font-black mb-8 tracking-tighter uppercase leading-none">Contribute.</h2>
                                <p className="text-slate-500 font-serif italic text-2xl mb-16 leading-relaxed">
                                    Share a fragment of a story that deserves preservation. Help us build the Sanctuary.
                                </p>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const btn = e.target.querySelector('button');
                                    btn.disabled = true; btn.innerText = "Preserving Narrative...";
                                    const data = Object.fromEntries(new FormData(e.target).entries());
                                    const success = await window.saveData('suggestions', data);
                                    if (success) { 
                                        alert("Your story has been added to the queue for the Sanctuary."); 
                                        setView('home'); 
                                    } else {
                                        alert("Connection failed.");
                                        btn.disabled = false;
                                    }
                                }} className="space-y-16">
                                    <div className="border-b-2 border-black/5 focus-within:border-black transition-colors pb-6">
                                        <label className="text-[10px] font-bold uppercase tracking-[0.4em] text-slate-400 mb-4 block">Identifier / Name</label>
                                        <input required name="name" className="w-full bg-transparent outline-none text-3xl font-bold tracking-tight" />
                                    </div>
                                    <div className="border-b-2 border-black/5 focus-within:border-black transition-colors pb-6">
                                        <label className="text-[10px] font-bold uppercase tracking-[0.4em] text-slate-400 mb-4 block">The Narrative Fragment</label>
                                        <textarea required name="story" rows="4" className="w-full bg-transparent outline-none text-2xl font-light leading-relaxed resize-none"></textarea>
                                    </div>
                                    <button className="w-full py-10 bg-black text-white rounded-3xl font-extrabold uppercase tracking-[0.5em] text-[10px] shadow-2xl hover:bg-indigo-700 transition-all">Submit to Archive</button>
                                </form>
                            </div>
                        )}
                    </main>

                    <footer className="py-32 text-center border-t border-black/5 mx-12 mt-40">
                        <p className="font-serif italic text-2xl text-slate-400 mb-6 tracking-tight">"To listen is to love."</p>
                        <div className="h-px w-24 bg-black/10 mx-auto mb-6"></div>
                        <p className="text-[9px] font-bold uppercase tracking-[0.6em] opacity-30">Sanctuary of Voices &copy; 2026</p>
                        <p className="text-[7px] font-bold uppercase tracking-[0.3em] opacity-20 mt-2">A Listening Voices Project Production</p>
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
