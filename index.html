<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Listening Voices Project</title>
    
    <!-- CONFIGURATION -->
    <script>
        window.AUDIO_CONFIG = {
            // Using the direct GitHub Raw link - the most reliable for public repos
            elias_audio: "https://raw.githubusercontent.com/MarlonB26/The-Listening-Voices/main/Mar.mp3" 
        };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lora:italic,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxYXQFTFKrcSSLI1hELd86tmrmb6ndRjQ",
            authDomain: "the-listening-voices-project.firebaseapp.com",
            projectId: "the-listening-voices-project",
            storageBucket: "the-listening-voices-project.firebasestorage.app",
            messagingSenderId: "23814688068",
            appId: "1:23814688068:web:bfa44db13579a08a0fdb11"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.saveToSanctuary = async (col, data) => {
            try { await addDoc(collection(db, col), { ...data, timestamp: serverTimestamp() }); return true; }
            catch (e) { return false; }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfd; }
        .font-serif { font-family: 'Lora', serif; }
        .logo-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .error-pulse { animation: pulse-red 2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('home');
            const [playing, setPlaying] = useState(false);
            const [loadError, setLoadError] = useState(null);
            const audioRef = useRef(null);

            const audioUrl = window.AUDIO_CONFIG.elias_audio;

            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [view]);

            const togglePlay = () => {
                if (!audioRef.current) return;

                if (playing) {
                    audioRef.current.pause();
                    setPlaying(false);
                } else {
                    setLoadError(null);
                    
                    const playPromise = audioRef.current.play();
                    
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                setPlaying(true);
                            })
                            .catch(e => {
                                console.error("Playback failed:", e);
                                setLoadError("Browser blocked playback or file missing.");
                                setPlaying(false);
                            });
                    }
                }
            };

            const handleForm = async (e, type) => {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target).entries());
                const success = await window.saveToSanctuary(type, data);
                if (success) { alert("Stored in Sanctuary."); e.target.reset(); }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 py-4 px-6">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div onClick={() => setView('home')} className="flex items-center gap-3 cursor-pointer">
                                <div className="w-10 h-10 logo-gradient rounded-xl flex items-center justify-center shadow-lg"><i data-lucide="mic" className="text-white w-5 h-5"></i></div>
                                <span className="font-bold text-xl tracking-tight text-slate-900">The Listening Voices</span>
                            </div>
                            <button onClick={() => setView('submit')} className="bg-slate-900 text-white px-6 py-2 rounded-full text-sm font-bold">Suggest</button>
                        </div>
                    </nav>

                    <main className="flex-grow pt-24">
                        {view === 'home' ? (
                            <div className="py-20 px-6 text-center">
                                <h1 className="text-5xl md:text-7xl font-extrabold mb-8 tracking-tighter text-slate-900">Bringing the <span className="italic font-serif text-indigo-600 underline decoration-indigo-100">forgotten</span> to the forefront.</h1>
                                <div onClick={() => setView('story')} className="max-w-md mx-auto cursor-pointer bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all group">
                                    <div className="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform">
                                        <i data-lucide="headphones" className="text-indigo-600 w-8 h-8"></i>
                                    </div>
                                    <h3 className="font-bold text-2xl mb-2">Elias of 5th Street</h3>
                                    <p className="text-slate-400 font-serif italic text-lg">"Listen to the Narrative"</p>
                                </div>
                            </div>
                        ) : view === 'story' ? (
                            <div className="max-w-2xl mx-auto py-12 px-6">
                                <button onClick={() => { setPlaying(false); setView('home'); }} className="mb-10 text-slate-400 font-bold text-xs uppercase tracking-widest flex items-center gap-2"><i data-lucide="arrow-left" className="w-4 h-4"></i> Back</button>
                                <h1 className="text-5xl font-extrabold mb-8 text-slate-900 leading-tight">Elias of 5th Street</h1>
                                
                                <div className={`border p-8 rounded-[2.5rem] mb-12 flex items-center gap-8 shadow-sm transition-all ${loadError ? 'bg-red-50 border-red-200' : 'bg-white border-indigo-100'}`}>
                                    <button 
                                        onClick={togglePlay} 
                                        className={`w-20 h-20 rounded-full flex items-center justify-center text-white shadow-xl transition-all active:scale-95 ${loadError ? 'bg-red-500' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                                    >
                                        {playing ? <i data-lucide="pause" className="w-8 h-8"></i> : <i data-lucide="play" className="w-8 h-8 ml-1"></i>}
                                    </button>
                                    <div className="flex-grow">
                                        <p className={`text-[10px] font-bold uppercase tracking-widest mb-1 ${loadError ? 'text-red-600' : 'text-indigo-500'}`}>
                                            {loadError ? "Playback Error" : "Archive Entry #001"}
                                        </p>
                                        <h4 className="font-bold text-xl text-slate-900">
                                            {loadError ? "Audio Link Broken" : "The Brickwork Narrative"}
                                        </h4>
                                        {loadError && (
                                            <div className="mt-2">
                                                <p className="text-xs text-red-500 font-medium italic mb-2">
                                                    {loadError}
                                                </p>
                                                <a href={audioUrl} target="_blank" className="text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded font-bold uppercase hover:bg-red-200 transition-colors">
                                                    Check File Directly
                                                </a>
                                            </div>
                                        )}
                                        <div className="mt-4 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                                            <div className={`h-full bg-indigo-500 transition-all duration-[300ms] ${playing ? 'w-full opacity-100' : 'w-0 opacity-0'}`} style={{ transitionDuration: playing ? '180s' : '0s' }}></div>
                                        </div>
                                    </div>
                                    
                                    <audio 
                                        ref={audioRef} 
                                        src={audioUrl} 
                                        crossOrigin="anonymous"
                                        onEnded={() => setPlaying(false)} 
                                        onError={(e) => {
                                            console.error("Audio Load Error");
                                            setLoadError("The file could not be found. Check if 'Mar.mp3' is spelled exactly like this on GitHub.");
                                        }}
                                        preload="auto" 
                                    />
                                </div>

                                <div className="font-serif text-xl md:text-2xl text-slate-700 italic space-y-8 leading-relaxed">
                                    <p>"People walk past me like I'm part of the brickwork. But the bricks have ears, and I've been listening to the city breathe for three decades."</p>
                                    <p>The city breathes through them, sharing secrets that go unnoticed by those who rush by.</p>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-xl mx-auto py-12 px-6">
                                <h2 className="text-4xl font-extrabold mb-8 text-slate-900">Suggest a Voice</h2>
                                <form onSubmit={(e) => handleForm(e, 'suggestions')} className="space-y-4">
                                    <input required name="name" className="w-full px-6 py-4 rounded-2xl bg-white border border-slate-200 outline-none focus:border-indigo-200" placeholder="Name" />
                                    <textarea required name="story" rows="4" className="w-full px-6 py-4 rounded-2xl bg-white border border-slate-200 outline-none focus:border-indigo-200 resize-none" placeholder="Story..."></textarea>
                                    <button className="w-full py-5 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-colors">Submit to Sanctuary</button>
                                </form>
                            </div>
                        )}
                    </main>
                    <footer className="py-20 bg-slate-950 text-white text-center rounded-t-[4rem] mt-20">
                        <p className="font-serif italic text-slate-500">"To listen is to love."</p>
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
